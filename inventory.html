<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="header">
    <h2>Daz Store</h2>
  </div>
  <div class="container_inventory">
    <h2>ADDING PRODUCT</h2>
    <form id="productForm" method="post">
      <br><br>
      <input id="entry_prodId"  type="text" name="productnumber" placeholder="Enter Last 3 Digit Number"/>
      <br><br>
      <input id="entry_name" type="text" name="productname" placeholder="Enter Product Name" />
      <br><br>
      <input id="entry_invest" type="text" name="investment" placeholder="Enter Puhunan" />
      <br><br>
      <input id="entry_wholesale" type="text" name="wholesale" placeholder="Enter Wholesale Price">
      <br><br>
      <input id="entry_numofWholesale" type="number" name="wholesaleNumber" placeholder="Enter Number of Wholesale">
      <br><br>
      <input id="entry_Retail" type="text" name="retail" placeholder="Enter Retail Price" />
      <br><br>
      <input id="entry_numofRetail" type="number" name="wholesaleNumber" placeholder="Enter Number of Retail">
      <br><br>
      <input id="button_submit_inven" type="submit" name="submit" value="SAVE" onclick="sumbitData()"/>
      <br><br>
      <input id="clear_button_inven" type="submit" name="clear" value="CLEAR" >
    </form>
  </div>
  <script src="store.js"></script>
</body>
</html
