      <form id="loginform" action="" method="post" onsubmit="return validate(event)">

        <br>
        <br>
        <input type="password" name="Password" id="password" placeholder="Password" required>
        <BR>
        <button id="sbmt" class="button" type="submit" onclick="validate()" >Login</button>
      </form>
    </div>
  </div>

  <script>
    function validate(event) {
      event.preventDefault();
      const warningBox = document.getElementById('warning');

      let un = document.getElementById('username').value;
      let pw = document.getElementById('password').value;

      if (un === "store" && pw === "daz123") {
        window.location.href = "home.html";
      }else if(un !== "store" && pw === "daz123"){
        const warnings = document.createTextNode('Incorrect Username!');
        const elements = document.getElementById('warning');
        elements.appendChild(warnings);
      }else if(un === "store" && pw !== "daz123"){
        const warnings = document.createTextNode('Incorrect Password!');
        const elements = document.getElementById('warning');
        elements.appendChild(warnings);
      } else {
        const warnings = document.createTextNode('Incorrect Username and Password!');
        const elements = document.getElementById('warning');
        elements.appendChild(warnings);
